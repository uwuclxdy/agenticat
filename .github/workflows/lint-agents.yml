name: lint-agents

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # actionlint is not preinstalled on the runner: fetch the pinned release.
      - name: workflow lint
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck not on PATH: actionlint would skip run: bodies"; exit 1; }
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: lint agent defs
        run: bun bin/lint-agents.ts agents --portable

      # A def that parses but converts to nothing usable still fails a user's install.
      # Counting misses a broken emit: a raw control byte in a body lands verbatim in a
      # TOML literal string, so parse every emitted codex .toml too.
      - name: converter smoke test
        run: |
          bun bin/install-agents.ts --dest "$RUNNER_TEMP/out"
          for t in opencode codex; do
            n=$(find "$RUNNER_TEMP/out/$t" -name '*.md' -o -name '*.toml' | wc -l)
            a=$(find agents -name '*.md' | wc -l)
            [ "$n" -eq "$a" ] || { echo "$t: converted $n of $a defs"; exit 1; }
          done
          for f in "$RUNNER_TEMP/out/codex"/*.toml; do
            [ -e "$f" ] || continue
            bun -e 'const { readFileSync } = require("node:fs"); const f = process.argv[1]; Bun.TOML.parse(readFileSync(f, "utf8"));' "$f" \
              || { echo "codex: $f is not valid TOML"; exit 1; }
          done

      # Every run gets a scratch HOME and --dest, so no real install path is touched.
      - name: converter tests
        run: bun test bin/

      # git grep rc: 0 = found (fail), 1 = clean (pass), anything else = error (fail).
      # needles use character classes so this file does not match its own search string.
      - name: no machine-specific references
        run: |
          rc=0; out=$(git grep -nE -e '/hom[e]/|192[.]168[.]|cloudif[y]|cloudy[-]|/User[s]/|/mn[t]/') || rc=$?
          if [ "$rc" -ne 1 ]; then
            printf '%s\n' "$out"
            echo "machine-specific reference found (grep rc=$rc; 1 = clean)"
            exit 1
          fi

      # Structural '| — |' table cells (an intentionally empty column) are the one sanctioned use.
      # needles are built from octal escapes so the grep line carries no literal dash.
      - name: no em or en dashes
        run: |
          em=$(printf '\342\200\224')
          en=$(printf '\342\200\223')
          rc=0; out=$(git grep -n -e "$em" -e "$en") || rc=$?
          if [ "$rc" -eq 0 ]; then
            hits=$(printf '%s\n' "$out" | sed "s/| $em |//g" | grep -e "$em" -e "$en" || true)
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits"
              echo "em/en dash found above"
              exit 1
            fi
          elif [ "$rc" -ne 1 ]; then
            echo "dash grep failed (rc=$rc)"
            exit 1
          fi

      - name: manifest validation
        run: |
          for f in .claude-plugin/marketplace.json plugins/agents/.claude-plugin/plugin.json plugins/skills/.claude-plugin/plugin.json; do
            jq -e 'has("$schema")' "$f" >/dev/null || { echo "$f: invalid JSON or missing \$schema"; exit 1; }
          done
          jq -e 'has("name") and has("version") and has("description")' gemini-extension.json >/dev/null \
            || { echo "gemini-extension.json: invalid JSON or missing name/version/description"; exit 1; }

      # The reminder's wording churns by design; the shape must hold: a SessionStart payload carrying a non-blank string.
      - name: session-start hook emits valid JSON
        run: |
          out=$(bash plugins/agents/scripts/session-start.sh)
          printf '%s\n' "$out" | jq -e '.hookSpecificOutput | (.hookEventName == "SessionStart") and (.additionalContext | type == "string" and test("\\S"))' >/dev/null \
            || { echo "session-start hook: invalid JSON or no non-blank SessionStart additionalContext string"; exit 1; }
          if bash plugins/agents/scripts/session-start.sh >/dev/full 2>/dev/null; then
            echo "session-start hook: exits 0 on a failed write"
            exit 1
          fi
